# What a Windows player downloads, made without game data: ReLink-Setup.exe (launcher/setup/setup.c, built with llvm-mingw) and
# the ReLink package (the launcher from dotnet publish, and the sources and tools the game is built with on the player's PC),
# split by scripts/make_setup_parts.py into the parts the setup downloads. The Python and CPM parts and the play profile are
# the latest release's (scripts/release_parts.py), or the seed's when the SEED_LIST variable names one in the builder-parts
# release (scripts/make_seed.py: a first release, or new tools or a new profile; docs/releasing.md).
# The Vulkan back end is compiled too, with the same llvm-mingw: players build it on their PC, this only checks that it builds.
# Every run leaves a workflow artifact. On a version tag (v1.2.3), the new parts go to the builder-parts release, and the setup,
# its list (relink-setup.txt) and the whole package as one zip for RecompLauncher (recomplauncher.json) to the tag's release.
name: Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  package:
    name: ReLink package and setup
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
 (the list of the newest stable release other than this tag- name: Check out source
 (the list of the newest stable release other than this tag  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
 (the list of the newest stable release other than this tag  with:
 (the list of the newest stable release other than this tag    # (the version is git describe's: the tags and the history since them)
 (the list of the newest stable release other than this tag    fetch-depth: 0
 (the list of the newest stable release other than this tag    persist-credentials: false
 (the list of the newest stable release other than this tag- name: Set up Python
 (the list of the newest stable release other than this tag  uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
 (the list of the newest stable release other than this tag  with:
 (the list of the newest stable release other than this tag    python-version: '3.12'
 (the list of the newest stable release other than this tag- name: Set up .NET
 (the list of the newest stable release other than this tag  uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
 (the list of the newest stable release other than this tag  with:
 (the list of the newest stable release other than this tag    dotnet-version: '9.0.x'

 (the list of the newest stable release other than this tag- name: llvm-mingw version
 (the list of the newest stable release other than this tag  id: llvm
 (the list of the newest stable release other than this tag  run: echo "name=$(python -I scripts/release_parts.py llvm-mingw --name)" >> "$GITHUB_OUTPUT"
 (the list of the newest stable release other than this tag- uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
 (the list of the newest stable release other than this tag  with:
 (the list of the newest stable release other than this tag    path: ${{ runner.temp }}/llvm
 (the list of the newest stable release other than this tag    key: ${{ steps.llvm.outputs.name }}
 (the list of the newest stable release other than this tag- name: llvm-mingw
 (the list of the newest stable release other than this tag  run: echo "LLVM_MINGW=$(python -I scripts/release_parts.py llvm-mingw "$RUNNER_TEMP/llvm")" >> "$GITHUB_ENV"

 (the list of the newest stable release other than this tag# (a tag is its own version; any other commit is git describe's: v0.6.1-3-g1a2b3c4, version 0.6.1-3-g1a2b3c4)
 (the list of the newest stable release other than this tag- name: Version
 (the list of the newest stable release other than this tag  run: |
 (the list of the newest stable release other than this tag    if [[ $GITHUB_REF == refs/tags/* ]]; then
 (the list of the newest stable release other than this tag      tag=$GITHUB_REF_NAME
 (the list of the newest stable release other than this tag    else
 (the list of the newest stable release other than this tag      tag=$(git describe --tags --match 'v[0-9]*' 2>/dev/null || echo "v0.0.0-$(git rev-parse --short HEAD)")
 (the list of the newest stable release other than this tag    fi
 (the list of the newest stable release other than this tag    echo "TAG=$tag" >> "$GITHUB_ENV"
 (the list of the newest stable release other than this tag    echo "VERSION=${tag#v}" >> "$GITHUB_ENV"
 (the list of the newest stable release other than this tag    echo "version: $tag"

 (the list of the newest stable release other than this tag# (the list of the newest stable release other than this tag: its tool parts, its prebuilt third_party files and its play
 (the list of the newest stable release other than this tag# profile. A release must have one; any other run goes on without, and its package then has only the app and .NET parts)
 (the list of the newest stable release other than this tag- name: The latest release's setup list
 (the list of the newest stable release other than this tag  env:
 (the list of the newest stable release other than this tag    GH_TOKEN: ${{ github.token }}
 (the list of the newest stable release other than this tag    BOOTSTRAP_REPO: ${{ vars.BOOTSTRAP_REPO }}
 (the list of the newest stable release other than this tag    BOOTSTRAP_LIST: ${{ vars.BOOTSTRAP_LIST }}
 (the list of the newest stable release other than this tag    SEED_LIST: ${{ vars.SEED_LIST }}
 (the list of the newest stable release other than this tag  run: |
 (the list of the newest stable release other than this tag    mkdir -p dist
 (the list of the newest stable release other than this tag    if python -I scripts/release_parts.py previous "$RUNNER_TEMP/found-setup.txt" \
 (the list of the newest stable release other than this tag        --repo "$GITHUB_REPOSITORY" --repo "${BOOTSTRAP_REPO:-pixl27/ProjectReLink}" \
 (the list of the newest stable release other than this tag        --list-name relink-setup.txt ${BOOTSTRAP_LIST:+--list-name "$BOOTSTRAP_LIST"} \
 (the list of the newest stable release other than this tag        ${SEED_LIST:+--seed "$SEED_LIST"} --skip-tag "$TAG"; then
 (the list of the newest stable release other than this tag      # (tool parts made under another name are repacked under this one, into dist: they are this repository's from then on)
 (the list of the newest stable release other than this tag      python -I scripts/release_parts.py adopt "$RUNNER_TEMP/found-setup.txt" "$RUNNER_TEMP/previous-setup.txt" dist \
 (the list of the newest stable release other than this tag        --base "https://github.com/$GITHUB_REPOSITORY/releases/download/builder-parts"
 (the list of the newest stable release other than this tag      echo "PREVIOUS=$RUNNER_TEMP/previous-setup.txt" >> "$GITHUB_ENV"
 (the list of the newest stable release other than this tag    elif [[ $GITHUB_REF == refs/tags/* ]]; then
 (the list of the newest stable release other than this tag      echo "::error::no earlier release's setup list and no seed: upload one and set the SEED_LIST variable (docs/releasing.md)"
 (the list of the newest stable release other than this tag      exit 1
 (the list of the newest stable release other than this tag    else
 (the list of the newest stable release other than this tag      echo "::warning::no earlier release's setup list: the package has only the app and .NET parts"
 (the list of the newest stable release other than this tag    fi

 (the list of the newest stable release other than this tag- name: Play profile
 (the list of the newest stable release other than this tag  if: env.PREVIOUS != ''
 (the list of the newest stable release other than this tag  run: python -I scripts/release_parts.py profile "$PREVIOUS" work

 (the list of the newest stable release other than this tag- name: ReLink-Setup.exe
 (the list of the newest stable release other than this tag  working-directory: launcher/setup
 (the list of the newest stable release other than this tag  run: |
 (the list of the newest stable release other than this tag    "$LLVM_MINGW/bin/x86_64-w64-mingw32-windres" setup.rc -O coff -o "$RUNNER_TEMP/setup_rc.o"
 (the list of the newest stable release other than this tag    "$LLVM_MINGW/bin/x86_64-w64-mingw32-clang" -O2 -mwindows -municode setup.c "$RUNNER_TEMP/setup_rc.o" \
 (the list of the newest stable release other than this tag      -lwinhttp -lbcrypt -lcomctl32 -lshell32 -lole32 -o "$RUNNER_TEMP/ReLink-Setup.exe"
 (the list of the newest stable release other than this tag    ls -l "$RUNNER_TEMP/ReLink-Setup.exe"

 (the list of the newest stable release other than this tag- name: ReLink
 (the list of the newest stable release other than this tag  run: >-
 (the list of the newest stable release other than this tag    dotnet publish launcher/ReLink.csproj --configuration Release
 (the list of the newest stable release other than this tag    -p:Version="$VERSION" -p:NuGetAudit=false --output "$RUNNER_TEMP/publish"

 (the list of the newest stable release other than this tag- name: Package folder
 (the list of the newest stable release other than this tag  run: >-
 (the list of the newest stable release other than this tag    python -I scripts/release_parts.py package "$RUNNER_TEMP/package"
 (the list of the newest stable release other than this tag    --publish "$RUNNER_TEMP/publish" --setup "$RUNNER_TEMP/ReLink-Setup.exe" ${PREVIOUS:+--list "$PREVIOUS"}

 (the list of the newest stable release other than this tag# (the game's own icon, from this repository's: the profile part carries the one of the release it came from)
 (the list of the newest stable release other than this tag- name: The game's icon
 (the list of the newest stable release other than this tag  run: |
 (the list of the newest stable release other than this tag    mkdir -p "$RUNNER_TEMP/package/tools/work"
 (the list of the newest stable release other than this tag    python -I nx2/make_icon.py launcher/app.ico "$RUNNER_TEMP/package/tools/work"

 (the list of the newest stable release other than this tag# (the Vulkan back end built here as a player's PC builds it: the package's own tools, the play profile, the CPM part and the
 (the list of the newest stable release other than this tag# same llvm-mingw. Shipped in the app part as tools/prebuilt/relink_vk.dll with its key (nx2/build.py vk_jobs_key): a player's
 (the list of the newest stable release other than this tag# first build whose key is the same takes it instead of compiling ~500 files; one with NVIDIA DLSS or another CPU level
 (the list of the newest stable release other than this tag# compiles them as before)
 (the list of the newest stable release other than this tag- name: Prebuilt Vulkan back end
 (the list of the newest stable release other than this tag  if: env.PREVIOUS != ''
 (the list of the newest stable release other than this tag  run: |
 (the list of the newest stable release other than this tag    cpm=$(python -I scripts/release_parts.py cpm "$PREVIOUS" "$RUNNER_TEMP/cpm")
 (the list of the newest stable release other than this tag    # (the release name the player's tools carry, which the Insert menu shows: make_setup_parts.py writes the same file)
 (the list of the newest stable release other than this tag    printf '%s\n' "$TAG" > "$RUNNER_TEMP/package/tools/version.txt"
 (the list of the newest stable release other than this tag    RELINK_MINGW="$LLVM_MINGW" RX_VK_ONLY=1 RX_RELEASE=1 RX_MARCH=x86-64-v3 RX_CPM="$cpm" OOT_WORK="$RUNNER_TEMP/vk-prebuilt" \
 (the list of the newest stable release other than this tag      RX_VK_PGO="$RUNNER_TEMP/package/tools/work/relink_vk.profdata" \
 (the list of the newest stable release other than this tag      python -I "$RUNNER_TEMP/package/tools/nx2/build.py" --standalone --jobs "$NUMBER_OF_PROCESSORS"
 (the list of the newest stable release other than this tag    mkdir -p "$RUNNER_TEMP/package/tools/prebuilt"
 (the list of the newest stable release other than this tag    cp "$RUNNER_TEMP/vk-prebuilt/sa/build/relink_vk.dll" "$RUNNER_TEMP/vk-prebuilt/sa/build/relink_vk.dll.key" \
 (the list of the newest stable release other than this tag      "$RUNNER_TEMP/package/tools/prebuilt/"
 (the list of the newest stable release other than this tag    cat "$RUNNER_TEMP/package/tools/prebuilt/relink_vk.dll.key"

 (the list of the newest stable release other than this tag- name: Setup parts
 (the list of the newest stable release other than this tag  run: |
 (the list of the newest stable release other than this tag    python -I scripts/make_setup_parts.py "$RUNNER_TEMP/package" "$TAG" dist \
 (the list of the newest stable release other than this tag      --base "https://github.com/$GITHUB_REPOSITORY/releases/download/builder-parts" ${PREVIOUS:+--reuse "$PREVIOUS"}
 (the list of the newest stable release other than this tag    cp "$RUNNER_TEMP/ReLink-Setup.exe" dist/ReLink-Setup.exe
 (the list of the newest stable release other than this tag    cat dist/relink-setup.txt
 (the list of the newest stable release other than this tag    ls -l dist

 (the list of the newest stable release other than this tag- uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
 (the list of the newest stable release other than this tag  with:
 (the list of the newest stable release other than this tag    name: ReLink-windows
 (the list of the newest stable release other than this tag    path: dist/
 (the list of the newest stable release other than this tag    if-no-files-found: error

  vulkan:
