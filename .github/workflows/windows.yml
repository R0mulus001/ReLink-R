  release:
    name: Release files
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, vulkan]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
 (the list of the newest stable release other than this tagcontents: write
    env:
 (the list of the newest stable release other than this tagGH_TOKEN: ${{ github.token }}
 (the list of the newest stable release other than this tagGH_REPO: ${{ github.repository }}
    steps:
 (the list of the newest stable release other than this tag- name: Check out source
 (the list of the newest stable release other than this tag  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
 (the list of the newest stable release other than this tag  with:
 (the list of the newest stable release other than this tag    persist-credentials: false
 (the list of the newest stable release other than this tag- uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
 (the list of the newest stable release other than this tag  with:
 (the list of the newest stable release other than this tag    name: ReLink-windows
 (the list of the newest stable release other than this tag    path: dist
 (the list of the newest stable release other than this tag# (named by their SHA-256: a part already there is the same file and is not uploaded again. Before the list, which names them)
 (the list of the newest stable release other than this tag- name: New parts to builder-parts
 (the list of the newest stable release other than this tag  run: |
 (the list of the newest stable release other than this tag    if ! gh release view builder-parts >/dev/null 2>&1; then
 (the list of the newest stable release other than this tag      gh release create builder-parts --prerelease --latest=false --target "$GITHUB_SHA" --title builder-parts \
 (the list of the newest stable release other than this tag        --notes "The parts ReLink-Setup.exe downloads, named by each release's relink-setup.txt."
 (the list of the newest stable release other than this tag    fi
 (the list of the newest stable release other than this tag    have=$(gh release view builder-parts --json assets --jq '.assets[].name')
 (the list of the newest stable release other than this tag    for f in dist/ReLink-*.zip; do
 (the list of the newest stable release other than this tag      if grep -qxF "$(basename "$f")" <<<"$have"; then
 (the list of the newest stable release other than this tag        echo "$(basename "$f"): already there"
 (the list of the newest stable release other than this tag      else
 (the list of the newest stable release other than this tag        gh release upload builder-parts "$f"
 (the list of the newest stable release other than this tag      fi
 (the list of the newest stable release other than this tag    done
 (the list of the newest stable release other than this tag# (RecompLauncher installs from one zip: every part the setup downloads, laid out as it installs them, with
 (the list of the newest stable release other than this tag# recomplauncher.json beside ReLink.exe. Parts in dist are not downloaded again)
