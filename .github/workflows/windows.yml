 (the list of the newest stable release other than this tag    python3 -I scripts/release_parts.py zip dist/relink-setup.txt "dist/ProjectReLink-$GITHUB_REF_NAME-Windows-x64.zip"
 (the list of the newest stable release other than this tag    --parts dist --add recomplauncher.json
 (the list of the newest stable release other than this tag- name: Setup and its list to the release
